<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionário de HTML e CSS</title>
    <link rel="stylesheet" href="estilos/questionario.css">
</head>
<body>
    <header>
        <h1>Questionário de HTML e CSS</h1>
    </header>
    <main>

        <form action="#" method="post">
            <fieldset>
                <legend>Teste seus conhecimentos</legend>

                <label for="q1">1. O que significa a sigla HTML?</label>
                <input type="text" id="q1" name="q1">

                <label for="q2">2. Para que serve o CSS em uma página web?</label>
                <textarea id="q2" name="q2" rows="4"></textarea>

                <label for="q3">3. Qual tag usamos para criar um link?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Escolha uma...</option>
                    <option value="a">&lt;link&gt;</option>
                    <option value="b">&lt;a&gt;</option>
                    <option value="c">&lt;href&gt;</option>
                    <option value="d">&lt;url&gt;</option>
                </select>

                <label for="q4">4. Quantos níveis de título (h) existem no HTML?</label>
                <input type="number" id="q4" name="q4" min="1" max="10">
            </fieldset>

            <button type="submit">Enviar Questionário</button>
        </form>
    </main>
</body>
</html>
