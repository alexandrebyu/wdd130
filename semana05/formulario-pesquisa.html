<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Pesquisa</title>
</head>

<body>
    <header>

    </header>
    <main>
        <form action="processar-pesquisa.php" method="post">
            <fieldset>
                <legend>Informações de Contato</legend>
                <label for="nome-completo">Nome Completo:</label>
                <input type="text" id="nome-completo" name="nome-completo" required><br><br>

                <label for="email">Email:</label>
                <input type="email" id="email-do-usuario" name="email-do-usuario" required><br><br>
            </fieldset><br>

            <fieldset>
                <legend>Perguntas</legend>
                <label for="navegador">Qual o seu navegador favorito de internet?</label>
                <select id="navegador" name="navegador">
                    <option value="">Selecione</option>
                    <option value="chrome">Chrome</option>
                    <option value="firefox">Firefox</option>
                    <option value="safari">Safari</option>
                    <option value="edge">Edge</option>
                    <option value="brave">Brave</option>
                    <option value="other">Other</option>
                </select><br><br>

                <label for="pet">Você tem um bichinho de estimação?</label>
                <input type="checkbox" id="pet" name="pet">
                <label for="sim">Sim</label><br><br>
                <label for="feedback">Liste os lugares onde você morou:</label><br><br>
                <textarea id="feedback" name="feedback" rows="4"
                    placeholder="Stillwater, Flórida, Amsterdã Holanda, Tibuktu Mali">
                </textarea><br><br> 
            </fieldset><br>
            <button type="submit">Enviar Pesquisa</button>
        </form>

    </main>
    <footer>

    </footer>
</body>

</html>
