<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Pesquisa</title>
    <link rel="stylesheet" href="estilos/formulario-pesquisa.css">
</head>

<body>
    <header>
        <h1>WDD 130 | Formulário HTML – Pesquisa de Usuário</h1>
    </header>
    <main>
        <form action="processar-pesquisa.php" method="post">
            <fieldset>
                <legend>Informações de Contato</legend>

                <div class="item-formulario coluna2">
                    <label for="nome-completo">Nome Completo:</label>
                    <input type="text" id="nome-completo" name="nome-completo" required>
                </div>

                <div class="item-formulario coluna2">
                    <label for="email-do-usuario">Email:</label>
                    <input type="email" id="email-do-usuario" name="email-do-usuario" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Perguntas</legend>

                <div class="coluna1">
                    <label for="navegador">Qual é o seu navegador favorito?</label>
                    <select id="navegador" name="navegador">
                        <option value="">Selecione</option>
                        <option value="chrome" selected>Chrome</option>
                        <option value="firefox">Firefox</option>
                        <option value="safari">Safari</option>
                        <option value="edge">Edge</option>
                        <option value="brave">Brave</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="coluna1">
                    <label for="pet">Você tem um animal de estimação?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>

                <div class="campo campo-vertical">
                    <label for="feedback">Liste os lugares onde você morou:</label>
                    <textarea id="feedback" name="feedback" rows="4"
                        placeholder="Stillwater, Flórida, Amsterdã Holanda, Timbuktu Mali">
                    </textarea>
                </div>
            </fieldset>

            <button type="submit">Enviar Pesquisa</button>
        </form>
    </main>
    <footer>

    </footer>
</body>

</html>
